name: test

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: "false"
      - uses: jdx/mise-action@v4.3.0
      - name: Lint
        run: mise run lint

  test-unit:
    name: test-unit
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: "false"
      - uses: jdx/mise-action@v4.3.0
      - name: Test
        run: mise run test

  govulncheck:
    name: govulncheck
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: berquerant/govulncheck-action@v1.0.3
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
